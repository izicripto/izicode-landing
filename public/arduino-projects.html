<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Innovation Hub - Izicode Edu</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tw/3afda25f.css">
    <link rel="stylesheet" href="css/dashboard-premium.css">
    <script type="module" src="js/firebase-config.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .diagram-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            padding: 1rem;
            transition: all 0.3s ease;
        }

        .diagram-card:hover {
            border-color: #0284c7;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1);
            transform: translateY(-2px);
        }

        .gradient-brand {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
    </style>
</head>

<body class="overflow-x-hidden min-h-screen">
    <!-- Mesh Background Decor -->
    <div class="fixed inset-0 -z-10 bg-[#f0f9ff]" style="background-image: 
            radial-gradient(at 0% 0%, hsla(203,100%,94%,1) 0, transparent 50%), 
            radial-gradient(at 50% 0%, hsla(199,100%,92%,1) 0, transparent 50%), 
            radial-gradient(at 100% 0%, hsla(190,100%,93%,1) 0, transparent 50%);">
    </div>

    <!-- Header -->
    <nav class="bg-white/40 backdrop-blur-2xl border-b border-white/20 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-4">
                    <a href="dashboard.html" onclick="if (window.history.length > 1) { window.history.back(); return false; }" class="p-2 hover:bg-white/50 rounded-xl transition-all">
                        <svg class="w-6 h-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </a>
                    <div class="flex items-center gap-3">
                        <img src="/images/logo.png" alt="Izicode" class="w-10 h-10">
                        <span class="font-display font-bold text-2xl text-slate-900 tracking-tight">Arduino Hub</span>
                    </div>
                </div>
                <div
                    class="hidden md:flex items-center gap-1 bg-white/50 p-1 rounded-2xl border border-white/50 shadow-sm">
                    <button
                        class="px-5 py-2.5 bg-brand-600 text-white rounded-[1rem] shadow-lg text-sm font-bold">Inspirado
                        em arduino.cc</button>
                    <button onclick="window.location.href='library.html'"
                        class="px-5 py-2.5 text-slate-600 hover:bg-white/80 rounded-[1rem] transition-all text-sm font-bold">Ver
                        Todos</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Hero Section -->
        <div class="text-center mb-16 animate-fade-in">
            <span
                class="px-4 py-1.5 bg-brand-100 text-brand-700 text-[10px] font-black uppercase tracking-widest rounded-full border border-brand-200 shadow-sm mb-6 inline-block">Projetos
                Oficiais & Comunidade</span>
            <h1 class="font-display text-5xl md:text-6xl font-black text-slate-900 mb-6 drop-shadow-sm">
                Arduino <span class="gradient-text">Innovation Hub</span>
            </h1>
            <p class="text-xl text-slate-600 max-w-2xl mx-auto leading-relaxed">
                Repositório de roteiros técnicos de alta precisão. Do protótipo à nuvem, aprenda a construir soluções
                reais passo a passo com guias detalhados.
            </p>
        </div>

        <!-- Featured Grid -->
        <h2 class="font-display text-2xl font-bold text-slate-900 mb-8 px-2 flex items-center gap-3">
            <div class="w-2 h-8 bg-brand-600 rounded-full"></div>
            Projetos Selecionados
        </h2>
        <div id="arduinoProjects" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Projetos injetados aqui -->
            <div class="col-span-full flex justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-brand-600"></div>
            </div>
        </div>
    </main>

    <!-- Detailed Project Viewer Modal -->
    <div id="projectViewer" class="fixed inset-0 z-[110] hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4 md:p-8">
            <div class="fixed inset-0 bg-slate-900/90 backdrop-blur-md" onclick="closeProjectViewer()"></div>

            <div
                class="relative bg-white rounded-[2.5rem] w-full max-w-6xl shadow-2xl flex flex-col md:flex-row overflow-hidden max-h-[90vh]">

                <!-- Sidebar Info (Desktop) -->
                <div class="w-full md:w-80 bg-slate-50 border-r border-slate-100 p-8 flex flex-col">
                    <div id="modalImageContainer"
                        class="w-full aspect-video rounded-3xl overflow-hidden mb-6 bg-white shadow-inner flex items-center justify-center border border-slate-200 p-2">
                        <img id="modalImage" src="" class="w-full h-full object-cover rounded-xl">
                    </div>

                    <div class="space-y-6 flex-1">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Dificuldade
                            </p>
                            <span id="modalDiff" class="text-sm font-bold text-slate-900"></span>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Duração</p>
                            <span id="modalDuration" class="text-sm font-bold text-slate-900"></span>
                        </div>
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Ferramentas
                            </p>
                            <div id="modalTools" class="flex flex-wrap gap-1 mt-1"></div>
                        </div>
                        <div id="modalBNCCContainer">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">BNCC</p>
                            <div id="modalBNCC" class="flex flex-wrap gap-1 mt-1"></div>
                        </div>

                        <div id="hacksterButtonContainer" class="hidden pt-6 border-t border-slate-200 mt-4">
                            <a id="hacksterLinkElement" href="#" target="_blank"
                                class="w-full flex items-center justify-center gap-2 bg-[#00adef] hover:bg-[#0091c0] text-white py-3 px-4 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all shadow-lg hover:shadow-[#00adef]/20">
                                <span>📖 Ver no Hackster</span>
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14">
                                    </path>
                                </svg>
                            </a>
                        </div>
                    </div>

                    <button onclick="window.print()"
                        class="mt-8 w-full py-3 bg-white border border-slate-200 text-slate-600 rounded-xl font-bold text-xs hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                        </svg>
                        EXPORTAR GUIA PDF
                    </button>
                </div>

                <!-- Main Content -->
                <div class="flex-1 flex flex-col min-w-0">
                    <!-- Modal Header -->
                    <div class="p-8 pb-0 flex justify-between items-start">
                        <div class="flex-1">
                            <h2 id="viewTitle" class="font-display text-3xl font-black text-slate-900 leading-tight">
                            </h2>
                            <p id="viewDesc" class="text-slate-500 mt-2 line-clamp-2"></p>
                        </div>
                        <button onclick="closeProjectViewer()"
                            class="p-2 hover:bg-slate-100 rounded-full transition-colors ml-4">
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- Tabs Menu -->
                    <div class="flex border-b border-slate-100 px-8 mt-6 overflow-x-auto no-scrollbar">
                        <button onclick="switchTab('vision')" id="tab-vision"
                            class="px-6 py-4 text-sm font-bold border-b-2 border-brand-600 text-brand-600 whitespace-nowrap transition-all">VISÃO
                            GERAL</button>
                        <button onclick="switchTab('assembly')" id="tab-assembly"
                            class="px-6 py-4 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 whitespace-nowrap transition-all">MONTAGEM
                            & DIAGRAMAS</button>
                        <button onclick="switchTab('code')" id="tab-code"
                            class="px-6 py-4 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 whitespace-nowrap transition-all">BIBLIOTECAS
                            & CÓDIGO</button>
                        <button onclick="switchTab('teacher')" id="tab-teacher"
                            class="px-6 py-4 text-sm font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-600 whitespace-nowrap transition-all">GUIA
                            PROFESSOR</button>
                    </div>

                    <!-- Tab Content -->
                    <div class="flex-1 overflow-y-auto p-8 bg-white overflow-x-hidden" id="tabScrollContainer">
                        <div id="viewContent"
                            class="prose prose-slate max-w-none prose-headings:font-display prose-headings:font-bold prose-p:leading-relaxed prose-img:rounded-3xl prose-pre:bg-slate-900 prose-pre:rounded-2xl prose-strong:text-brand-600">
                            <!-- Content Injected Here -->
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="p-6 border-t border-slate-50 bg-slate-50/50 flex justify-end">
                        <button onclick="closeProjectViewer()"
                            class="px-8 py-3 gradient-brand text-white rounded-2xl font-bold shadow-lg shadow-blue-500/20 active:scale-95 transition-all">
                            VOLTAR AO HUB
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module">
        import { getAllProjects } from './js/projects-data.js';

        const container = document.getElementById('arduinoProjects');
        const projects = getAllProjects().filter(p =>
            p.tools.includes('Arduino') || p.tools.includes('IoT Cloud') || p.id.includes('arduino')
        );

        let currentActiveProject = null;

        function render() {
            container.innerHTML = projects.map((p, index) => {
                let imageSrc = 'images/arduino.png';

                if (p.image) {
                    if (p.image.startsWith('http')) {
                        imageSrc = p.image;
                    } else {
                        // Clean the name and ensure it points to the local images folder
                        let cleanName = p.image.replace(/^\//, '').replace(/^images\//, '');

                        // Map specific generic names to existing high-quality photos
                        if (cleanName.includes('scratch-game')) cleanName = 'pupils-doing-task-laptops-focused-teacher-monitoring-them.jpg';
                        if (cleanName.includes('microbit-weather')) cleanName = 'mixed-race-boy-glasses-rising-hand-answer-lesson.jpg';
                        if (cleanName.includes('tinkercad-city')) cleanName = 'woman-looking-into-tablet-happy-girl.jpg';
                        if (cleanName.includes('arduino-traffic')) cleanName = 'close-up-making-robots.jpg';
                        if (cleanName === 'python') cleanName = 'tools/python.jpg';

                        // If no extension, default to .jpg
                        if (!cleanName.includes('.')) cleanName += '.jpg';

                        imageSrc = 'images/' + cleanName;
                    }
                }

                return `
                <div class="glass-card rounded-[2.5rem] p-4 flex flex-col group animate-fade-in" style="animation-delay: ${index * 0.1}s">
                    <div class="relative h-56 rounded-[2rem] overflow-hidden mb-6 bg-slate-100">
                        <img src="${imageSrc}" 
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-90 group-hover:opacity-100" 
                             onerror="this.src='images/arduino.png'">
                        
                        <div class="absolute top-4 left-4 flex flex-col gap-2">
                            <span class="px-3 py-1 bg-white/90 backdrop-blur-md text-slate-900 text-[10px] font-black uppercase tracking-widest rounded-full shadow-sm w-fit">${p.difficulty}</span>
                            <span class="px-3 py-1 bg-brand-600/90 backdrop-blur-md text-white text-[10px] font-black uppercase tracking-widest rounded-full shadow-sm w-fit">${p.duration}</span>
                        </div>
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-8">
                           <div class="transform translate-y-4 group-hover:translate-y-0 transition-transform duration-500">
                                <p class="text-white font-display font-bold text-lg mb-1">Passo a Passo Completo</p>
                                <p class="text-slate-300 text-xs">Inclui Esquema Elétrico e Código</p>
                           </div>
                        </div>
                    </div>
                    
                    <div class="px-4 pb-6 flex-1 flex flex-col">
                        <div class="flex items-center gap-2 mb-3">
                            ${p.tools.map(t => `<span class="text-[10px] font-bold text-brand-600 uppercase tracking-tighter bg-brand-50 px-2.5 py-1 rounded-lg border border-brand-100">${t}</span>`).join('')}
                        </div>
                        <h3 class="font-display font-black text-2xl text-slate-900 mb-3 leading-tight group-hover:text-brand-600 transition-colors">${p.title}</h3>
                        <p class="text-sm text-slate-500 leading-relaxed mb-8 flex-1">${p.description}</p>
                        
                        <button onclick="viewProject('${p.id}')" 
                                class="w-full py-4 gradient-brand text-white rounded-[1.5rem] font-bold shadow-xl shadow-blue-500/10 hover:shadow-blue-500/30 hover:scale-[1.02] transition-all active:scale-95">
                                Ver Detalhes do Projeto
                        </button>
                    </div>
                </div>
            `;
            }).join('');
        }

        window.viewProject = (id) => {
            const project = projects.find(p => p.id === id);
            if (!project) return;
            currentActiveProject = project;

            // Header & Info
            document.getElementById('viewTitle').innerText = project.title;
            document.getElementById('viewDesc').innerText = project.description;
            document.getElementById('modalDiff').innerText = project.difficulty;
            document.getElementById('modalDuration').innerText = project.duration;

            let imageSrc = 'images/arduino.png';
            if (project.image) {
                if (project.image.startsWith('http')) {
                    imageSrc = project.image;
                } else {
                    let cleanName = project.image.replace(/^\//, '').replace(/^images\//, '');
                    if (cleanName.includes('scratch-game')) cleanName = 'pupils-doing-task-laptops-focused-teacher-monitoring-them.jpg';
                    if (cleanName.includes('microbit-weather')) cleanName = 'mixed-race-boy-glasses-rising-hand-answer-lesson.jpg';
                    if (cleanName.includes('tinkercad-city')) cleanName = 'woman-looking-into-tablet-happy-girl.jpg';
                    if (cleanName.includes('arduino-traffic')) cleanName = 'close-up-making-robots.jpg';
                    if (cleanName === 'python') cleanName = 'tools/python.jpg';
                    if (!cleanName.includes('.')) cleanName += '.jpg';
                    imageSrc = 'images/' + cleanName;
                }
            }
            document.getElementById('modalImage').src = imageSrc;

            // Tools & BNCC
            document.getElementById('modalTools').innerHTML = project.tools.map(t => `<span class="px-2 py-1 bg-white border border-slate-200 text-slate-600 text-[10px] font-bold rounded-md">${t}</span>`).join('');

            if (project.bncc && project.bncc.length > 0) {
                document.getElementById('modalBNCCContainer').classList.remove('hidden');
                document.getElementById('modalBNCC').innerHTML = project.bncc.map(b => `<span class="px-2 py-1 bg-indigo-50 border border-indigo-100 text-indigo-600 text-[10px] font-bold rounded-md">${b}</span>`).join('');
            } else {
                document.getElementById('modalBNCCContainer').classList.add('hidden');
            }

            // Handle Hackster Link
            const hacksterBtn = document.getElementById('hacksterButtonContainer');
            const hacksterLink = document.getElementById('hacksterLinkElement');
            if (project.hacksterLink) {
                hacksterBtn.classList.remove('hidden');
                hacksterLink.href = project.hacksterLink;
            } else {
                hacksterBtn.classList.add('hidden');
            }

            switchTab('vision');
            document.getElementById('projectViewer').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.switchTab = function (tab) {
            if (!currentActiveProject) return;

            // Update UI
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('border-brand-600', 'text-brand-600');
                btn.classList.add('border-transparent', 'text-slate-400');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if (activeBtn) {
                activeBtn.classList.add('border-brand-600', 'text-brand-600');
                activeBtn.classList.remove('border-transparent', 'text-slate-400');
            }

            const viewContent = document.getElementById('viewContent');
            const content = currentActiveProject.content || "# Sem conteúdo disponível.";
            let finalHtml = "";

            if (tab === 'vision') {
                const parts = content.split(/## .* (Materiais|Passo a Passo|Configuração)/i);
                finalHtml = marked.parse(parts[0]);
            } else if (tab === 'assembly') {
                const parts = content.split(/## .* (Materiais|Passo a Passo|Esquema)/i);
                let assemblyMd = "";

                if (parts.length > 1) {
                    const sectionsAfterHeader = parts.slice(1).join('\n');
                    const finalPart = sectionsAfterHeader.split(/## .* (Programação|Código|Dicas)/i)[0];
                    assemblyMd = "# Guia de Montagem e Conexões\n\n" + (parts[1] ? "## " + parts[1] + "\n\n" : "") + finalPart;
                } else {
                    assemblyMd = "# Guia de Montagem\n\nConfigure o hardware seguindo o esquema padrão do Arduino.";
                }

                // Technical Diagrams Section
                let diagramsHtml = "";
                if (currentActiveProject.schematic || currentActiveProject.hardwareDiagram || currentActiveProject.softwareFlow) {
                    diagramsHtml = `
                        <div class="bg-slate-50 rounded-[2rem] p-8 mb-12 border border-slate-100 not-prose">
                            <h2 class="text-2xl font-black text-slate-900 mb-8 flex items-center gap-3">
                                <span class="w-10 h-10 rounded-xl gradient-brand flex items-center justify-center text-white text-sm">📐</span>
                                Documentação Técnica (Project Hub)
                            </h2>
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                ${currentActiveProject.schematic ? `
                                    <div class="flex flex-col gap-3">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Schematic Diagram</p>
                                        <div class="diagram-card aspect-[3/4] flex items-center justify-center bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm group cursor-pointer">
                                            <img src="${currentActiveProject.schematic}" class="max-h-full object-contain p-4 group-hover:scale-105 transition-transform" onerror="this.src='images/construction.png'">
                                        </div>
                                    </div>
                                ` : ''}
                                ${currentActiveProject.hardwareDiagram ? `
                                    <div class="flex flex-col gap-3">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Diagram Hardware Version</p>
                                        <div class="diagram-card aspect-[3/4] flex items-center justify-center bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm group cursor-pointer">
                                            <img src="${currentActiveProject.hardwareDiagram}" class="max-h-full object-contain p-4 group-hover:scale-105 transition-transform" onerror="this.src='images/construction.png'">
                                        </div>
                                    </div>
                                ` : ''}
                                ${currentActiveProject.softwareFlow ? `
                                    <div class="flex flex-col gap-3">
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Diagram Software Version</p>
                                        <div class="diagram-card aspect-[3/4] flex items-center justify-center bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm group cursor-pointer">
                                            <img src="${currentActiveProject.softwareFlow}" class="max-h-full object-contain p-4 group-hover:scale-105 transition-transform" onerror="this.src='images/construction.png'">
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                // Step Images
                let imagesHtml = "";
                if (currentActiveProject.stepImages && currentActiveProject.stepImages.length > 0) {
                    imagesHtml = `
                        <h3 class="text-xl font-black text-slate-900 mb-6 not-prose">Galeria de Execução</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-12 not-prose">
                            ${currentActiveProject.stepImages.map((img, i) => {
                        let stepSrc = 'images/close-up-making-robots.jpg';
                        if (img.startsWith('http')) {
                            stepSrc = img;
                        } else {
                            let cleanName = img.replace(/^\//, '').replace(/^images\//, '');
                            if (!cleanName.includes('.')) cleanName += '.jpg';
                            stepSrc = 'images/' + cleanName;
                        }

                        return `
                                    <div class="group relative aspect-video rounded-3xl overflow-hidden bg-white border border-slate-200 shadow-sm">
                                        <img src="${stepSrc}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.src='images/arduino.png'">
                                        <div class="absolute bottom-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-black px-2.5 py-1 rounded-lg">FOTO 0${i + 1}</div>
                                    </div>
                                `;
                    }).join('')}
                        </div>
                    `;
                }

                finalHtml = diagramsHtml + imagesHtml + marked.parse(assemblyMd);
            } else if (tab === 'code') {
                const parts = content.split(/## .* (Programação|Código|Solução)/i);
                if (parts.length > 1) {
                    finalHtml = marked.parse("# Programação Técnica\n\n" + parts.slice(1).join('\n'));
                } else {
                    finalHtml = marked.parse("# Código\n\nCrie um novo sketch no Arduino IDE e implemente a lógica.");
                }
            } else if (tab === 'teacher') {
                const guide = currentActiveProject.teacherGuide;
                finalHtml = `
                    <div class="space-y-10 not-prose">
                        <!-- Header Banner -->
                        <div class="relative overflow-hidden rounded-[2.5rem] bg-slate-900 p-8 md:p-12 text-white shadow-2xl">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-brand-600/20 blur-[120px] rounded-full -mr-32 -mt-32"></div>
                            <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-600/10 blur-[100px] rounded-full -ml-32 -mb-32"></div>
                            
                            <div class="relative z-10 flex flex-col md:flex-row items-center gap-8">
                                <div class="w-24 h-24 rounded-3xl gradient-brand flex items-center justify-center text-5xl shadow-2xl transform -rotate-3">🎓</div>
                                <div class="text-center md:text-left">
                                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/10 mb-4">
                                        <span class="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
                                        <span class="text-[10px] font-black uppercase tracking-widest text-brand-200">Plano Pedagógico Exclusivo</span>
                                    </div>
                                    <h2 class="text-4xl md:text-5xl font-black mb-2 font-display tracking-tight">Guia do Educador</h2>
                                    <p class="text-slate-400 text-lg max-w-2xl font-medium">Instruções de mediação e parâmetros de avaliação alinhados às diretrizes educacionais vigentes.</p>
                                </div>
                            </div>
                        </div>

                        <!-- Core Methodology Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Objective Card -->
                            <div class="group p-8 rounded-3xl bg-white border border-slate-100 shadow-sm hover:shadow-xl hover:border-brand-100 transition-all duration-500">
                                <div class="w-12 h-12 rounded-2xl bg-green-50 text-green-600 flex items-center justify-center text-2xl mb-6 group-hover:scale-110 transition-transform">🎯</div>
                                <h3 class="text-xl font-black text-slate-900 mb-4 font-display">Objetivo Central</h3>
                                <p class="text-slate-600 leading-relaxed font-medium">${guide?.objective || "Desenvolver autonomia técnica e habilidades de resolução de problemas através da robótica prática."}</p>
                            </div>

                            <!-- Skills Card -->
                            <div class="group p-8 rounded-3xl bg-white border border-slate-100 shadow-sm hover:shadow-xl hover:border-brand-100 transition-all duration-500">
                                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl mb-6 group-hover:scale-110 transition-transform">🤝</div>
                                <h3 class="text-xl font-black text-slate-900 mb-4 font-display">Habilidades Foco</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${(guide?.skills || ["Lógica de Programação", "Colaboração", "Experimentação"]).map(s => `
                                        <span class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl text-[11px] font-bold border border-slate-100 group-hover:bg-brand-50 group-hover:text-brand-700 group-hover:border-brand-100 transition-colors">${s}</span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Standards & Assessment -->
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <!-- ODS -->
                            <div class="relative overflow-hidden p-8 rounded-[2rem] bg-indigo-50 border border-indigo-100 flex flex-col items-center text-center">
                                <span class="text-5xl mb-6 filter drop-shadow-lg">🌍</span>
                                <h4 class="font-black text-[10px] uppercase tracking-[0.2em] text-indigo-400 mb-3">Conexão Global</h4>
                                <p class="text-sm font-bold text-indigo-900 leading-relaxed">${currentActiveProject.ods}</p>
                            </div>

                            <!-- BNCC -->
                            <div class="relative overflow-hidden p-8 rounded-[2rem] bg-brand-600 text-white flex flex-col items-center text-center shadow-lg shadow-brand-200">
                                <span class="text-5xl mb-6 filter drop-shadow-lg">📚</span>
                                <h4 class="font-bold text-[10px] uppercase tracking-[0.2em] text-white/50 mb-3">Diretrizes BNCC</h4>
                                <div class="flex flex-wrap justify-center gap-2 mt-auto">
                                    ${currentActiveProject.bncc.map(b => `<span class="px-3 py-1.5 bg-white/20 backdrop-blur-md rounded-lg text-[10px] font-black border border-white/10">${b}</span>`).join('')}
                                </div>
                            </div>

                            <!-- Assessment -->
                            <div class="relative overflow-hidden p-8 rounded-[2rem] bg-amber-50 border border-amber-100 flex flex-col items-center text-center">
                                <span class="text-5xl mb-6 filter drop-shadow-lg">🔍</span>
                                <h4 class="font-black text-[10px] uppercase tracking-[0.2em] text-amber-500 mb-3">Sugestão de Avaliação</h4>
                                <p class="text-sm font-bold text-amber-900 leading-relaxed italic">"${guide?.assessment || "Análise do funcionamento do protótipo e engajamento durante a solução de problemas."}"</p>
                            </div>
                        </div>

                        <!-- Additional Media/Support -->
                        <div class="bg-slate-50 border border-slate-100 rounded-[2.5rem] p-8 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-white shadow-sm flex items-center justify-center text-xl text-brand-600">💡</div>
                                <p class="text-slate-600 text-sm font-medium">Precisa de ajuda com este projeto? Nossa equipe de suporte pedagógico está disponível no portal.</p>
                            </div>
                            <button class="px-6 py-3 bg-white text-slate-900 font-black text-xs uppercase tracking-wider rounded-xl border border-slate-200 hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all shadow-sm">
                                Baixar PDF Completo
                            </button>
                        </div>
                    </div>
                `;
            }

            viewContent.innerHTML = finalHtml;
            document.getElementById('tabScrollContainer').scrollTop = 0;
        };

        window.closeProjectViewer = () => {
            document.getElementById('projectViewer').classList.add('hidden');
            document.body.style.overflow = 'auto';
            currentActiveProject = null;
        };

        render();
    </script>
</body>

</html>
