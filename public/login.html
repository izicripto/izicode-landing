<!DOCTYPE html>
<html lang="pt-BR">

<head>
<!-- Consentimento antes de tudo: firebase-config.js chama getAnalytics,
     que inicializa o GA4. Como e modulo, ele so roda depois da analise
     do documento; este script e classico e sincrono, entao declara o
     estado negado primeiro. Invertida a ordem, o cookie e gravado antes
     de perguntar. -->
<script src="/js/consentimento.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Izicode Edu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/tw/d4b36466.css">
    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            border: 3px solid #e0f2fe;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.6s linear infinite;
        }
    </style>
  <script src="/js/toast.js"></script>
</head>

<body class="bg-white min-h-screen flex flex-col md:flex-row">

    <!--
        Metade Visual/Branding.

        A foto cobre a coluna INTEIRA, e nao apenas a faixa de baixo. Ela e
        retrato (1067x1600); num quadro quase quadrado, o recorte de
        preenchimento comia a cabeca e os pes do robo, e sobrava um close do
        meio que nao se lia como robo nenhum. Ocupando a coluna toda, a
        proporcao do quadro fica perto da proporcao da foto e quase nada e
        cortado.

        O texto continua sempre legivel, que era a intencao do desenho
        anterior: em vez de uma faixa branca solida cortando a imagem, um
        degrade de branco opaco no topo ate quase transparente embaixo. O
        texto fica sobre a parte opaca e a foto aparece inteira embaixo dele.

        Degrade em estilo embutido, e nao em classe do Tailwind: esta pagina
        carrega um CSS ja compilado, onde uma classe de gradiente que nao
        estava no build simplesmente nao existe — e falharia em silencio.
    -->
    <div class="hidden md:flex md:w-1/2 relative overflow-hidden bg-slate-100">
        <div class="absolute inset-0"
            style="background-image: url('images/telalogin.jpg'); background-size: cover; background-position: center 45%;"></div>
        <div class="absolute inset-0" style="background-image: linear-gradient(to bottom, #ffffff 0%, #ffffff 27%, rgba(255,255,255,.45) 44%, rgba(255,255,255,.10) 100%);"></div>
        <div class="relative z-10 w-full px-12 pt-16 text-center">
            <img src="images/logo.png" alt="Izicode Logo" class="w-32 h-32 mx-auto mb-8">
            <h1 class="font-display text-4xl font-bold text-slate-900 mb-4">Bem-vindo à Revolução Maker</h1>
            <p class="text-slate-600 text-lg">Acesse as ferramentas que vão transformar a educação na sua escola.</p>
        </div>
    </div>

    <!-- Metade Login (Branco) -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white">
        <div class="max-w-sm w-full">
            <div class="md:hidden text-center mb-8">
                <img src="images/logo.png" alt="Izicode Logo" class="w-20 h-20 mx-auto mb-4">
                <h2 class="font-display text-2xl font-bold text-slate-900">Izicode Edu</h2>
            </div>

            <div class="text-left mb-10">
                <h2 class="text-3xl font-bold text-slate-900 mb-2">Entrar na Plataforma</h2>
                <p class="text-slate-500">Use sua conta institucional ou pessoal do Google.</p>
            </div>

            <button id="googleLoginBtn"
                class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 py-3.5 px-4 rounded-xl font-bold text-slate-700 hover:bg-slate-50 hover:border-brand-300 transition-all shadow-sm">
                <svg id="googleIcon" class="w-6 h-6" viewBox="0 0 48 48">
                    <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                    </path>
                    <path fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                    </path>
                    <path fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z">
                    </path>
                    <path fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                    </path>
                </svg>
                <span id="btnText">Entrar com Google</span>
                <div id="spinner" class="spinner hidden"></div>
            </button>

            <div class="mt-8 text-center">
                <a href="/" class="text-slate-400 text-sm hover:text-brand-600 transition-colors">← Voltar para
                    o site</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, provider, signInWithPopup, signInWithRedirect, getRedirectResult, db, doc, setDoc, getDoc } from './js/firebase-config.js';

        /**
         * Entrar com o Google: janela, e redirecionamento quando a janela
         * nao abre.
         *
         * signInWithPopup falha no navegador embutido do Instagram, do
         * Facebook e do LinkedIn — que e' exatamente por onde chega quem
         * clica num anuncio em rede social. Ali o popup e' bloqueado e o
         * botao simplesmente nao faz nada: a pessoa conclui que o site esta
         * quebrado e vai embora, depois de ja ter custado o clique.
         *
         * O popup continua sendo o caminho preferido porque nao tira a
         * pessoa da pagina. So quando ele falha por motivo de ambiente e'
         * que trocamos por redirecionamento, que funciona em qualquer
         * navegador.
         */
        const FALHA_DE_AMBIENTE = [
            'auth/popup-blocked',
            'auth/operation-not-supported-in-this-environment',
            'auth/cancelled-popup-request',
            'auth/web-storage-unsupported',
        ];

        async function entrarComGoogle() {
            try {
                return await signInWithPopup(auth, provider);
            } catch (erro) {
                if (FALHA_DE_AMBIENTE.includes(erro && erro.code)) {
                    // Sai da pagina: o retorno cai em getRedirectResult, no
                    // carregamento seguinte.
                    await signInWithRedirect(auth, provider);
                    return null;
                }
                throw erro;
            }
        }

        const btn = document.getElementById('googleLoginBtn');
        const btnText = document.getElementById('btnText');
        const googleIcon = document.getElementById('googleIcon');
        const spinner = document.getElementById('spinner');

        /**
         * O que fazer depois que o Google confirmou quem e' a pessoa.
         *
         * Vale para os dois caminhos: a janela (popup) e a volta do
         * redirecionamento. Duplicar isso significaria que quem entrou pelo
         * navegador do Instagram teria um comportamento diferente de quem
         * entrou pelo Chrome — e a diferenca so apareceria em producao.
         */
        async function concluirEntrada(user) {
            btnText.textContent = 'Verificando perfil...';

            const userDocRef = doc(db, "users", user.uid);
            const userSnap = await getDoc(userDocRef);

            if (userSnap.exists()) {
                const userData = userSnap.data();
                const email = user.email;

                const isHardcoded = ['izicripto@gmail.com', 'izicodeedu@gmail.com', 'r.berlanda04@gmail.com'].includes(email);

                if (userData.onboardingCompleted || isHardcoded) {
                    const saved = sessionStorage.getItem('redirect_after_login');
                    sessionStorage.removeItem('redirect_after_login');
                    // Destino unico: /app (SPA). O proprio painel decide qual
                    // home mostrar conforme o papel.
                    window.location.href = saved || "/app";
                    return;
                }
            }

            btnText.textContent = 'Indo para configuração...';
            const urlParams = new URLSearchParams(window.location.search);
            const schoolId = urlParams.get('schoolId');
            const role = urlParams.get('role');
            let target = "onboarding";
            const params = [];
            if (schoolId) params.push(`schoolId=${schoolId}`);
            if (role) params.push(`role=${role}`);
            if (params.length > 0) target += "?" + params.join("&");
            window.location.href = target;
        }

        /**
         * Volta do redirecionamento.
         *
         * Quando o popup falha e caimos para signInWithRedirect, a pessoa
         * sai da pagina e volta ja autenticada. Sem esta chamada ela voltaria
         * para a tela de login como se nada tivesse acontecido — logada no
         * Firebase, mas parada aqui.
         */
        getRedirectResult(auth)
            .then((resultado) => {
                if (resultado && resultado.user) {
                    btn.disabled = true;
                    googleIcon.classList.add('hidden');
                    spinner.classList.remove('hidden');
                    return concluirEntrada(resultado.user);
                }
            })
            .catch((erro) => {
                console.error('[Login] Falha na volta do redirecionamento:', erro);
            });

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btnText.textContent = 'Conectando...';
            googleIcon.classList.add('hidden');
            spinner.classList.remove('hidden');

            try {
                const result = await entrarComGoogle();
                // Sem resultado significa que fomos para o redirecionamento:
                // a pagina ja esta saindo, e a volta cai em getRedirectResult.
                if (!result) return;
                await concluirEntrada(result.user);

            } catch (error) {
                console.error(error);
                alert("Erro ao autenticar: " + error.message);
                btn.disabled = false;
                btnText.textContent = 'Entrar com Google';
                googleIcon.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
