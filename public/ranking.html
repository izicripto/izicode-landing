<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Izicode Edu</title>
    <meta name="robots" content="noindex, nofollow">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/logo.png">
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="/js/auth-guard.js"></script>
    <link rel="stylesheet" href="css/tw/307c7233.css">
</head>

<body class="bg-slate-50">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
            <div class="p-6 border-b border-slate-100">
                <a href="dashboard.html" class="flex items-center gap-3 group">
                    <div
                        class="bg-brand-50 p-2 rounded-2xl border border-brand-100 group-hover:scale-110 transition-transform">
                        <img src="/images/logo.png" alt="Izicode Edu Logo" class="w-10 h-10">
                    </div>
                    <span class="font-display font-bold text-xl text-slate-900">Izicode</span>
                </a>
            </div>
            <nav class="flex-1 p-4">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl font-medium transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Voltar ao Dashboard
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <header class="mb-10">
                <h1 class="font-display text-3xl font-bold text-slate-900 flex items-center gap-3">
                    <span class="text-4xl">🏆</span> Ranking da Escola
                </h1>
                <p id="rankingSubtitle" class="text-slate-500 mt-1">Alunos com mais XP na sua escola.</p>
            </header>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-3xl">
                <!-- Loading -->
                <div id="loadingState" class="text-center text-slate-500 py-10">
                    <svg class="animate-spin h-8 w-8 text-brand-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <p>Carregando ranking...</p>
                </div>

                <!-- No school -->
                <div id="noSchoolState" class="text-center text-slate-500 py-10 hidden">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    <h3 class="font-bold text-slate-700">Ranking disponível para turmas vinculadas a uma escola</h3>
                    <p class="mt-1">Sua conta ainda não está associada a uma escola/turma.</p>
                </div>

                <!-- Empty -->
                <div id="emptyState" class="text-center text-slate-500 py-10 hidden">
                    <p>Ainda não há alunos com XP registrado nesta escola.</p>
                </div>

                <!-- List -->
                <div id="rankingList" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, doc, getDoc, collection, query, where, orderBy, limit, getDocs } from './js/firebase-config.js';

        const loadingState = document.getElementById('loadingState');
        const noSchoolState = document.getElementById('noSchoolState');
        const emptyState = document.getElementById('emptyState');
        const rankingList = document.getElementById('rankingList');
        const subtitle = document.getElementById('rankingSubtitle');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadRanking(user);
            } else {
                window.location.href = 'index.html';
            }
        });

        async function loadRanking(user) {
            try {
                const meSnap = await getDoc(doc(db, 'users', user.uid));
                const schoolId = meSnap.exists() ? meSnap.data().schoolId : null;

                if (!schoolId) {
                    loadingState.classList.add('hidden');
                    noSchoolState.classList.remove('hidden');
                    return;
                }

                // Regras do Firestore só permitem ler outros usuários da mesma
                // escola (schoolId), então essa query precisa desse filtro —
                // ver firestore.rules e a auditoria de segurança do projeto.
                const q = query(
                    collection(db, 'users'),
                    where('schoolId', '==', schoolId),
                    orderBy('xp', 'desc'),
                    limit(50)
                );
                const snapshot = await getDocs(q);
                const students = snapshot.docs
                    .map(d => d.data())
                    .filter(u => !u.role || ['student', 'maker'].includes(u.role));

                loadingState.classList.add('hidden');

                if (students.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                renderList(students);
            } catch (e) {
                console.error('Erro ao carregar ranking:', e);
                loadingState.innerHTML = '<p class="text-red-500">Não foi possível carregar o ranking agora.</p>';
            }
        }

        function renderList(students) {
            const medals = ['🥇', '🥈', '🥉'];
            rankingList.innerHTML = students.map((u, i) => {
                const isTop3 = i < 3;
                const name = u.displayName || u.name || 'Explorador';
                const level = Math.floor((u.xp || 0) / 1000) + 1;
                return `
                    <div class="flex items-center gap-4 p-4 rounded-xl ${isTop3 ? 'bg-brand-50 border border-brand-100' : 'hover:bg-slate-50'} transition-colors">
                        <span class="w-8 text-lg font-black ${isTop3 ? 'text-brand-600' : 'text-slate-400'}">${medals[i] || (i + 1) + 'º'}</span>
                        <img src="${u.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`}"
                            class="w-10 h-10 rounded-full" alt="${name}">
                        <div class="flex-1 min-w-0">
                            <p class="font-bold text-slate-900 truncate">${name}</p>
                            <p class="text-xs text-slate-400">Nível ${level}</p>
                        </div>
                        <span class="font-black text-brand-600 text-sm whitespace-nowrap">${(u.xp || 0).toLocaleString('pt-BR')} XP</span>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>

</html>
