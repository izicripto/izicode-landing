<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guias — Izicode Edu</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="/css/guias.css">
<script>
/*
  Esta página era o leitor dos guias: recebia ?doc=05-GUIA-BNCC-TECNOLOGIA,
  baixava o Markdown e montava tudo no navegador.

  Os guias agora são páginas estáticas em /guias/<slug>, geradas por
  scripts/gerar-guias.mjs. O motivo é de busca orgânica: a versão antiga
  entregava um HTML vazio ao robô e só preenchia depois que o JavaScript
  rodava, numa URL com parâmetro de query — e as sete páginas nasciam com o
  mesmo título.

  O arquivo permanece como redirecionador porque os endereços antigos estão
  no sitemap, podem ter sido compartilhados e talvez já estejam indexados.
  Removê-lo geraria 404 para quem chegasse por um link salvo; redirecionar
  leva a pessoa ao lugar certo e diz ao Google para transferir o que a URL
  antiga tiver acumulado.

  O noindex acima garante que este redirecionador nunca dispute espaço com
  a página de destino.
*/
(function () {
  var DESTINOS = {
    '01-GUIA-HACKATHON-ESCOLAR': 'hackathon-escolar',
    '02-GUIA-OLIMPIADAS-COMPETICOES': 'olimpiadas-e-competicoes',
    '03-GUIA-PRATICAS-RESTAURATIVAS': 'praticas-restaurativas',
    '04-GUIA-PROJETOS-ODS': 'projetos-ods',
    '05-GUIA-BNCC-TECNOLOGIA': 'bncc-tecnologia',
    '06-GUIA-ECOLOGIA-SUSTENTABILIDADE': 'ecologia-e-sustentabilidade',
    '07-MANUAL-IMPLEMENTACAO': 'manual-de-implementacao'
  };

  var doc = new URLSearchParams(window.location.search).get('doc');
  var slug = doc && DESTINOS[doc];

  // replace() e não href: assim o endereço antigo não fica no histórico, e
  // o botão "voltar" não devolve a pessoa para cá só para redirecionar de
  // novo — o mesmo tipo de laço que prendia a Academia e o curso.
  window.location.replace(slug ? '/guias/' + slug + '/' : '/guias/');
})();
</script>
</head>
<body>
  <main class="gz-pagina">
    <p>Redirecionando para o guia…</p>
    <p><a class="gz-link" href="/guias/">Ver todos os guias</a></p>
  </main>
</body>
</html>
