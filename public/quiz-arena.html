<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Izicode Edu</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="css/tw/665bd930.css">
    <style>
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            75% {
                transform: translateX(8px);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            70% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.26, 0.53, 0.74, 1.48) forwards;
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #94a3b8;
            background-color: #f8fafc;
        }

        .option-card:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 0 0 0 #e5e7eb !important;
        }

        .option-card.selected {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 4px 0 0 #3b82f6 !important;
        }

        .option-card.correct {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            box-shadow: 0 4px 0 0 #22c55e !important;
            color: #15803d !important;
        }

        .option-card.wrong {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            box-shadow: 0 4px 0 0 #ef4444 !important;
            color: #b91c1c !important;
        }

        .progress-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .mascot-container {
            perspective: 1000px;
        }

        .mascot-content {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mascot-container:hover .mascot-content {
            transform: rotateY(10deg) rotateX(10deg);
        }
    </style>
</head>

<body class="bg-white min-h-screen flex flex-col font-sans">

    <!-- Header / Progress Bar -->
    <header class="max-w-2xl mx-auto w-full px-6 py-8 flex items-center gap-6">
        <button onclick="history.back()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div class="h-4 bg-slate-200 rounded-full flex-1 overflow-hidden relative">
            <div id="quizProgress" class="h-full bg-brand-500 rounded-full transition-all duration-500"
                style="width: 0%">
                <div class="absolute inset-0 bg-white/20 w-full h-full animate-pulse"></div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <!-- Keys Indicator -->
            <div class="flex items-center gap-1 text-amber-500 font-bold font-display" title="Chaves Disponíveis">
                <span>🗝️</span>
                <span id="keysCount">--</span>
            </div>
            <!-- Hearts Indicator -->
            <div class="flex items-center gap-1 text-red-500 font-bold font-display" title="Vidas">
                <span>❤️</span>
                <span id="lives">3</span>
            </div>
        </div>
    </header>

    <!-- Quiz Content -->
    <main class="flex-1 flex flex-col max-w-2xl mx-auto w-full px-6 pb-40">

        <!-- Question & Mascot -->
        <div class="flex gap-4 mb-12 items-start opacity-0" id="questionContainer"
            style="transition: all 0.5s ease-out">
            <div class="mascot-container shrink-0">
                <div id="mascot"
                    class="mascot-content w-20 h-20 md:w-28 md:h-28 flex items-center justify-center bg-blue-100 rounded-[2rem] text-4xl md:text-6xl border-4 border-blue-200 shadow-xl float">
                    🤖
                </div>
            </div>
            <div class="flex-1 pt-2 md:pt-4 relative">
                <!-- Speech Bubble Shape -->
                <div class="bg-white border-2 border-slate-100 rounded-3xl p-6 md:p-8 shadow-sm relative">
                    <div
                        class="absolute -left-2 top-8 w-4 h-4 bg-white border-l-2 border-b-2 border-slate-100 transform rotate-45 hidden md:block">
                    </div>
                    <h1 id="questionText"
                        class="text-xl md:text-2xl font-display font-bold text-slate-700 leading-tight">
                        🚀 Carregando seu próximo desafio...
                    </h1>
                </div>
            </div>
        </div>

        <!-- Options Grid -->
        <div id="optionsGrid" class="grid grid-cols-1 gap-4">
            <!-- Dynamic Options Injected Here -->
            <!-- Example Style for Ref:
            <button class="option-card w-full p-4 rounded-2xl border-2 border-slate-200 shadow-btn hover:bg-slate-50 text-left font-bold text-slate-700 text-lg transition-all group active:translate-y-1 active:shadow-none">
                <div class="flex items-center gap-4">
                    <span class="w-8 h-8 rounded-lg border-2 border-slate-200 flex items-center justify-center text-slate-400 text-sm group-[.selected]:border-blue-500 group-[.selected]:text-blue-500">A</span>
                    Opção de Resposta
                </div>
            </button> 
            -->
        </div>

    </main>

    <!-- Bottom Action Sheet (Success/Error/Check) -->
    <div id="bottomSheet"
        class="fixed bottom-0 left-0 right-0 p-6 border-t-2 border-slate-100 bg-white transition-colors duration-300 z-50">
        <div class="max-w-2xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">

            <!-- Feedback Message -->
            <div id="feedbackArea" class="hidden flex items-center gap-4 w-full">
                <div id="feedbackIcon"
                    class="w-16 h-16 rounded-full flex items-center justify-center text-3xl shrink-0 bg-white">
                    ✅
                </div>
                <div>
                    <h3 id="feedbackTitle" class="font-display font-bold text-2xl mb-1">Correto!</h3>
                    <p id="feedbackText" class="text-sm font-medium opacity-90">Explicação da resposta aqui.</p>
                </div>
            </div>

            <!-- Action Button -->
            <div class="w-full md:w-auto">
                <button id="actionBtn"
                    class="w-full md:w-48 py-3.5 rounded-2xl font-display font-bold text-lg uppercase tracking-wide text-white shadow-btn-primary bg-brand-500 hover:bg-brand-600 active:shadow-btn-primary-active active:translate-y-1 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    Verificar
                </button>
            </div>

        </div>
    </div>

    <!-- Audio Effects (Files missing, tags removed to stop 404s) -->
    <!-- <audio id="sndCorrect" src="assets/sounds/correct.mp3"></audio> -->
    <!-- <audio id="sndWrong" src="assets/sounds/wrong.mp3"></audio> -->

    <script type="module" src="js/quiz-arena.js?v=4"></script>

</body>

</html>
