name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A landing page (app/) e o restante do site (public/) ainda são dois
      # projetos separados — o app roda numa SPA React/Vite, o resto é HTML
      # estático servido direto. Aqui buildamos o app e sobrepomos a saída
      # em cima de public/ só nesta pasta de trabalho do runner (nunca é
      # commitado): substitui public/index.html pela home nova e adiciona os
      # assets do app na raiz. Todas as outras páginas em public/ (login,
      # dashboards, portal etc.) continuam do jeito que estão.
      - name: Build React app
        run: |
          cd app
          npm ci
          npm run build

      - name: Merge React build into public/
        run: cp -r app/dist/. public/

      # --only hosting,firestore:rules — as regras de segurança do Firestore
      # (firestore.rules) moravam só no repositório até agora: este workflow
      # nunca as publicava, então mudanças de rules (como a subcoleção
      # courseProgress da Academia do Professor) ficavam commitadas mas
      # inertes, e toda escrita que dependesse delas era negada em produção.
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: izicodeedu-532ac

      # As Cloud Functions ficavam de fora do deploy automático, então
      # qualquer função nova (aiChat, createAbacatePayCheckout,
      # abacatePayWebhook) existia no repositório mas respondia 404 em
      # produção — o plano PRO não conseguia usar a IA pela chave
      # gerenciada porque o endpoint simplesmente não estava publicado.
      #
      # Fica num passo separado e com continue-on-error de propósito: se o
      # deploy de functions falhar (cota, permissão do token, erro de
      # build), o site e as regras já publicados no passo anterior seguem
      # no ar. A falha aparece no log da Action em vez de derrubar tudo.
      - name: Deploy Cloud Functions
        continue-on-error: true
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: izicodeedu-532ac
