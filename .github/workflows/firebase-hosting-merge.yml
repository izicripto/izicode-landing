name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # A landing page (app/) e o restante do site (public/) ainda são dois
      # projetos separados — o app roda numa SPA React/Vite, o resto é HTML
      # estático servido direto. Aqui buildamos o app e sobrepomos a saída
      # em cima de public/ só nesta pasta de trabalho do runner (nunca é
      # commitado): substitui public/index.html pela home nova e adiciona os
      # assets do app na raiz. Todas as outras páginas em public/ (login,
      # dashboards, portal etc.) continuam do jeito que estão.
      - name: Build React app
        run: |
          cd app
          npm ci
          npm run build

      - name: Merge React build into public/
        run: cp -r app/dist/. public/

      # --only hosting,firestore:rules — as regras de segurança do Firestore
      # (firestore.rules) moravam só no repositório até agora: este workflow
      # nunca as publicava, então mudanças de rules (como a subcoleção
      # courseProgress da Academia do Professor) ficavam commitadas mas
      # inertes, e toda escrita que dependesse delas era negada em produção.
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: izicodeedu-532ac

  # Job separado de propósito, e SEM continue-on-error.
  #
  # Como não declara `needs`, roda em paralelo e uma falha aqui não impede
  # a publicação do site acima. E como pode falhar de verdade, o erro
  # aparece vermelho no painel da Action — a primeira tentativa usava
  # `continue-on-error` dentro do job principal, o que marcava o passo
  # como "success" mesmo quando o deploy falhava e escondeu por completo
  # o motivo de aiChat continuar respondendo 404 em produção.
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Instala as dependências antes de empacotar: erro de dependência
      # aparece aqui, com mensagem clara, em vez de dentro do build remoto.
      - name: Install functions dependencies
        run: |
          cd functions
          npm install

      # Duas credenciais de propósito, e a ação usa a que estiver preenchida.
      #
      # FIREBASE_TOKEN (gerado por `firebase login:ci`) ainda publica
      # hosting, mas o Firebase descontinuou esse tipo de token para
      # operações que tocam o Google Cloud — e deploy de functions é uma
      # delas. Foi exatamente esse o sintoma aqui: o mesmo token publicava
      # o site e falhava nas functions.
      #
      # O caminho suportado hoje é uma conta de serviço. Assim que o
      # secret GCP_SA_KEY existir no repositório, este passo passa a usá-lo
      # sozinho; sem ele, segue tentando pelo token antigo. Ver
      # docs/DEPLOY-FUNCTIONS.md para como gerar a chave.
      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: izicodeedu-532ac
