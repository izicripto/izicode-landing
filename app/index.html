<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/izicode-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Izicode Edu — Plataforma e Consultoria em Robótica Educacional</title>
    <meta
      name="description"
      content="Plataforma para professores planejarem aulas de robótica com IA, alinhadas à BNCC — comece de graça. E consultoria para escolas que querem montar o laboratório maker e formar a equipe docente."
    />
    <!--
      Endereço oficial do site. O mesmo conteúdo também responde em
      izicodeedu-532ac.web.app, e sem esta linha o Google decide sozinho
      qual dos dois indexar — já tendo decidido pelo web.app antes.
      As páginas internas sobrescrevem este valor em app/src/lib/seo.ts.
    -->
    <link rel="canonical" href="https://izicode.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Izicode Edu" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Izicode Edu — Plataforma e Consultoria em Robótica Educacional" />
    <meta
      property="og:description"
      content="Planeje aulas de robótica com IA, alinhadas à BNCC, e comece de graça. Para escolas, montamos o laboratório maker e formamos a equipe docente."
    />
    <meta property="og:url" content="https://izicode.com.br/" />
    <meta property="og:image" content="https://izicode.com.br/hero-lab.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Izicode Edu — Plataforma e Consultoria em Robótica Educacional" />
    <meta
      name="twitter:description"
      content="Planeje aulas de robótica com IA, alinhadas à BNCC, e comece de graça."
    />
    <meta name="twitter:image" content="https://izicode.com.br/hero-lab.jpg" />

    <!--
      Instalação como aplicativo.

      O manifest, o service worker e o script de instalação já existiam e
      respondiam 200, mas nenhuma página os referenciava — a plataforma
      simplesmente não era instalável. Sem a linha abaixo o navegador nem
      chega a considerar a instalação, e o banner de instalar não teria o
      que oferecer.

      As meta do apple-* existem porque o Safari não lê o manifest: no
      iPhone o "Adicionar à Tela de Início" usa estas.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Izicode" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
